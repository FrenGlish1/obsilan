[package]
name = "obsilan"
version = "0.4.0"
description = "Prise de notes Markdown, compatible Obsidian"
edition = "2021"

[lib]
# Nom de la bibliothèque (différent du binaire pour éviter un conflit sous Windows).
name = "obsilan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Binaire plus petit.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
